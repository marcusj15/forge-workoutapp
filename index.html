<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="theme-color" content="#0D0D0D">
<title>FORGE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0D0D;--card:#161616;--line:#2A2A2A;--tx:#F0F0F0;--mut:#777;--y:#FFD700;--r:#FF5252;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--tx);font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:1px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-size:16px}
input,textarea{width:100%;background:#111;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;margin-top:4px}
input:focus,textarea:focus{outline:none;border-color:var(--y)}
input[type=range]{padding:0;accent-color:var(--y)}
label{display:block;font-size:13px;color:var(--mut);letter-spacing:2px;margin-bottom:12px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:15px;resize:none}
.pg{max-width:600px;margin:0 auto;padding:12px 16px 96px}
header{text-align:center;padding:20px 0 8px}
.logo{font-size:52px;letter-spacing:6px;color:var(--y);text-shadow:0 0 30px #FFD70055}
.mono,.tag{font-family:ui-monospace,Menlo,monospace}
.tag{color:var(--mut);font-size:12px;letter-spacing:4px;margin-top:4px}
.mut{color:var(--mut)}.y{color:var(--y)}.c{text-align:center}
.sh2,.nav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px;color:var(--mut);font-size:14px;letter-spacing:3px}
.nav b{font-weight:400;font-size:17px;color:#888}
.b1{background:var(--y);color:#000}.b2{background:#1E1E1E;color:#aaa;border:1px solid #333}
.b3{background:#1E1E1E;color:#aaa;border:1px solid #333;padding:6px 12px;font-size:14px}
.bd{background:#FF525222;color:var(--r);border:1px solid #FF525244}
.bk{background:none;color:var(--y);padding:6px 0}
.wide{width:100%;margin-top:8px}.fl{flex:1}.big{width:100%;padding:18px;font-size:22px;border-radius:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
h2{font-size:22px;font-weight:400}h1{font-size:36px;font-weight:400}
.badge{background:#222;color:#888;font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.pills i{font-style:normal;background:#1E1E1E;border:1px solid #333;color:#999;font-size:13px;padding:3px 10px;border-radius:20px}
.row{display:flex;gap:8px;align-items:center}
.add{width:100%;background:none;border:2px dashed var(--line);color:#555;padding:30px;font-size:18px;border-radius:16px;letter-spacing:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.g4 label{margin:0;font-size:11px;text-align:center}
.tc{background:#111;border:2px solid;border-radius:14px;padding:14px 6px;text-align:center}
.tc p{font-size:12px;letter-spacing:2px;margin:4px 0 8px}
.row2{display:flex;align-items:center;justify-content:center;gap:6px}.row2 button{padding:6px 11px}
.tv{font-size:28px;min-width:32px}
.srow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #1E1E1E;font-size:14px}
.gx{margin:12px 0}.note{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#999;padding:4px 0 4px 10px;border-left:2px solid #333}
.lab{font-size:12px;color:var(--mut);letter-spacing:2px;margin-bottom:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#111;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border-radius:0;padding:16px 0;color:#666;font-size:18px;letter-spacing:3px}.tabs .on{color:var(--y)}
.act{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:500px;margin:0 auto;padding:16px;display:flex;flex-direction:column;align-items:center}
.pbar{display:flex;gap:8px;width:100%;margin-bottom:12px}.pbar i{flex:1;height:4px;border-radius:2px}
.pl{font-size:24px;letter-spacing:4px;margin-bottom:16px}
.ringw{position:relative;width:220px;height:220px;margin-bottom:20px}
.ringw svg{position:absolute;inset:0}
.ri{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tn{font-size:56px;line-height:1}.ts{color:var(--mut);font-size:12px;letter-spacing:2px;margin-top:4px}
.exi{width:100%;background:#111;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.exn{font-size:28px;text-align:center;margin-bottom:12px}
.st{display:flex;justify-content:center;margin-bottom:14px}.st div{text-align:center;padding:0 18px;border-left:1px solid var(--line)}.st div:first-child{border:0}
.st b{display:block;font-size:26px;font-weight:400;color:var(--y)}.st span{font-size:11px;color:var(--mut);letter-spacing:2px}
.dots{display:flex;justify-content:center;gap:8px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid transparent}
.ctl{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:auto}
.ctl .big{color:#000}.ctl .row button{flex:1;background:#161616;border:1px solid var(--line);color:#aaa}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;background:#161616;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92dvh;overflow-y:auto}
.sheet h3{font-weight:400;font-size:24px;color:var(--y);margin-bottom:14px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--y);color:#000;padding:10px 20px;border-radius:10px;z-index:30;display:none}
</style></head><body>
<div id="app"></div><div id="sheet"></div><div id="toast"></div><div id="confirm"></div>
<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fd=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const tsets=w=>w.exercises.reduce((a,e)=>a+e.sets,0);
const PH={WARMUP:{l:'WARM UP',c:'#FF6B35',i:'🔥'},EXERCISE:{l:'EXERCISE',c:'#FFD700',i:'⚡'},REST:{l:'REST',c:'#9C88FF',i:'💤'},COOLDOWN:{l:'COOL DOWN',c:'#4FC3F7',i:'❄️'},DONE:{l:'DONE!',c:'#00E676',i:'🏆'}};
let workouts=ld('forge.workouts',[{id:'1',name:'Push Day',exercises:[
 {id:'e1',name:'Bench Press',sets:4,minReps:8,maxReps:12,restTime:90},
 {id:'e2',name:'Overhead Press',sets:3,minReps:8,maxReps:10,restTime:75},
 {id:'e3',name:'Tricep Dips',sets:3,minReps:10,maxReps:15,restTime:60}]}]);
let history=ld('forge.history',[]),unit=ld('forge.unit','lb');
let view='home',sel=null,ed=null,S=null,sheet=null,oh=null,wl=null;
const times={warmup:5,duration:45,cooldown:5};
const saveH=()=>sv('forge.history',history);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
const tabs=()=>`<nav class="tabs"><button data-a="go" data-v="home" class="${view==='home'?'on':''}">WORKOUTS</button><button data-a="go" data-v="hist" class="${view==='hist'?'on':''}">HISTORY</button></nav>`;

const home=()=>`<div class="pg"><header><div class="logo">⚡ FORGE</div><p class="tag">BUILD. GRIND. REPEAT.</p></header>
<div class="sh2"><span>YOUR WORKOUTS</span><button class="b3" data-a="unit">${unit}</button></div>
${workouts.map(w=>`<div class="card"><div class="top"><h2>${esc(w.name)}</h2><span class="badge">${w.exercises.length} exercises</span></div><p class="mono mut" style="font-size:12px">${tsets(w)} total sets</p><div class="pills">${w.exercises.slice(0,3).map(e=>`<i>${esc(e.name)}</i>`).join('')}${w.exercises.length>3?`<i>+${w.exercises.length-3}</i>`:''}</div><div class="row"><button class="b1 fl" data-a="start" data-id="${w.id}">▶ START</button><button class="b2" data-a="edit" data-id="${w.id}">✎ Edit</button><button class="bd" data-a="delw" data-id="${w.id}">✕</button></div></div>`).join('')}
<button class="add" data-a="new">+ NEW WORKOUT</button></div>${tabs()}`;

const edit=()=>`<div class="pg"><div class="nav"><button class="bk" data-a="go" data-v="home">← Back</button><b>EDIT WORKOUT</b><button class="b1" data-a="save">Save</button></div>
<label>WORKOUT NAME<input data-s="wn" value="${esc(ed.name)}" placeholder="e.g. Push Day"></label>
<div class="sh2"><span>EXERCISES</span><button class="b3" data-a="addEx">+ Add</button></div>
${ed.exercises.length?'':'<p class="mono mut c" style="padding:20px 0">No exercises yet. Add your first one.</p>'}
${ed.exercises.map((x,i)=>`<div class="card"><div class="row"><span class="y">#${i+1}</span><input data-s="ex" data-id="${x.id}" data-f="name" value="${esc(x.name)}" style="margin:0"><button class="bd" data-a="rmEx" data-id="${x.id}">✕</button></div><div class="g4">${[['sets','Sets'],['minReps','Min reps'],['maxReps','Max reps'],['restTime','Rest (s)']].map(([f,l])=>`<label>${l}<input type="number" inputmode="numeric" min="0" data-s="ex" data-id="${x.id}" data-f="${f}" value="${x[f]}"></label>`).join('')}</div></div>`).join('')}
${workouts.some(w=>w.id===ed.id)?'<button class="bd wide" data-a="del">Delete workout</button>':''}</div>`;

const pre=()=>{const w=sel;return `<div class="pg"><div class="nav"><button class="bk" data-a="go" data-v="home">← Back</button><b>START WORKOUT</b><span></span></div>
<h1 class="y c">${esc(w.name)}</h1><p class="mono mut c" style="font-size:13px;margin-top:6px">${w.exercises.length} exercises, ${tsets(w)} sets</p>
<div class="g3">${[['warmup','🔥','WARM UP','#FF6B35'],['duration','⚡','DURATION','#FFD700'],['cooldown','❄️','COOL DOWN','#4FC3F7']].map(([k,i,l,c])=>`<div class="tc" style="border-color:${c}"><div style="font-size:26px">${i}</div><p style="color:${c}">${l}</p><div class="row2"><button class="b2" data-a="t" data-k="${k}" data-d="-1">−</button><span class="tv">${times[k]}</span><button class="b2" data-a="t" data-k="${k}" data-d="1">+</button></div><p class="mut mono">min</p></div>`).join('')}</div>
<div class="card"><p class="lab">EXERCISE ORDER</p>${w.exercises.map((e,i)=>`<div class="srow"><span><span class="y">${i+1}</span> &nbsp;${esc(e.name)}</span><span class="mono mut">${e.sets}×${e.minReps}-${e.maxReps} · ${e.restTime}s</span></div>`).join('')}</div>
<button class="b1 big" data-a="begin">▶ BEGIN WORKOUT</button></div>`};

const group=log=>{const m={};log.forEach(l=>(m[l.ex]=m[l.ex]||[]).push(l));return Object.entries(m).map(([n,ls])=>`<div class="gx"><p class="y">${esc(n)}</p>${ls.map(l=>`<div class="srow"><span class="mono">Set ${l.set}</span><span class="mono">${l.w===''?'no weight':l.w+' '+l.u} × ${l.reps||'?'} · effort ${l.rpe}/10</span></div>${l.note?`<p class="note">${esc(l.note)}</p>`:''}`).join('')}</div>`).join('')};
const volume=log=>log.reduce((a,l)=>a+(+l.w||0)*(+l.reps||0),0);
const hrow=h=>{const v=volume(h.log),open=oh===String(h.id);return `<div class="card"><div class="top" data-a="hx" data-id="${h.id}" style="cursor:pointer"><div><h2>${esc(h.workout)}</h2><p class="mono mut" style="font-size:12px;margin-top:4px">${fd(h.date)}<br>${h.log.length} sets${h.mins?`, ${h.mins} min`:''}${v?`, volume ${Math.round(v).toLocaleString()}`:''}</p></div><span class="badge">${open?'▲':'▼'}</span></div>
${open?`<label style="margin-top:12px">DATE<input type="date" data-s="hd" data-id="${h.id}" value="${h.date}"></label>${group(h.log)||'<p class="mono mut">No sets were logged.</p>'}<label style="margin-top:12px">NOTES ON PROGRESS OR DISCOMFORT<textarea rows="3" data-s="hn" data-id="${h.id}">${esc(h.note||'')}</textarea></label><button class="bd wide" data-a="hdel" data-id="${h.id}">Delete session</button>`:''}</div>`};
const hist=()=>{const pb={};history.forEach(h=>h.log.forEach(l=>{if(l.w!==''&&(!pb[l.ex]||l.w>pb[l.ex].w))pb[l.ex]=l}));
const list=history.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
return `<div class="pg"><header><div class="logo" style="font-size:40px">HISTORY</div></header>
${Object.keys(pb).length?`<div class="card"><p class="lab">HEAVIEST LIFTS</p>${Object.entries(pb).map(([n,l])=>`<div class="srow"><span>${esc(n)}</span><span class="mono">${l.w} ${l.u} × ${l.reps||'?'}</span></div>`).join('')}</div>`:''}
${list.length?list.map(hrow).join(''):'<p class="mono mut c" style="padding:40px 0">No sessions yet. Finish a workout and it shows up here.</p>'}</div>${tabs()}`};

function active(){const s=S,P=PH[s.phase],ex=s.w.exercises[s.ei],d=s.phase==='DONE';
const[tm,tot]=s.phase==='WARMUP'?[s.wr,s.wt]:s.phase==='COOLDOWN'?[s.cr,s.ct]:s.phase==='REST'?[s.rr,s.rt]:[s.dr,s.dt];
const C=2*Math.PI*90,pr=d?1:Math.max(0,1-tm/Math.max(1,tot)),cur={WARMUP:0,EXERCISE:1,REST:1,COOLDOWN:2,DONE:3}[s.phase];
const v=volume(s.log);
return `<div class="act" style="background:${P.c}15"><div class="pbar">${[0,1,2].map(i=>`<i style="background:${i<=cur?P.c:'#333'}"></i>`).join('')}</div>
<div class="pl" style="color:${P.c}">${P.i} ${P.l}${s.paused?' (PAUSED)':''}</div>
<div class="ringw"><svg width="220" height="220"><circle cx="110" cy="110" r="90" fill="none" stroke="#222" stroke-width="10"/><circle cx="110" cy="110" r="90" fill="none" stroke="${P.c}" stroke-width="10" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pr)}" stroke-linecap="round" transform="rotate(-90 110 110)"/></svg>
<div class="ri">${d?'<span style="font-size:60px">🏆</span>':`<span class="tn" style="color:${P.c}">${fmt(tm)}</span><span class="ts">${s.phase==='EXERCISE'?'WORKOUT LEFT':s.phase==='REST'?'REST':''}</span>`}</div></div>
${(s.phase==='EXERCISE'||s.phase==='REST')&&ex?`<div class="exi">${s.phase==='REST'?'<p class="ts c" style="margin:0 0 4px">UP NEXT</p>':''}<p class="exn">${esc(ex.name)}</p><div class="st"><div><b>${s.si+1}/${ex.sets}</b><span>SET</span></div><div><b>${ex.minReps}–${ex.maxReps}</b><span>REPS</span></div><div><b>${s.ei+1}/${s.w.exercises.length}</b><span>EXERCISE</span></div></div>
<div class="dots">${Array.from({length:ex.sets},(_,i)=>`<i style="background:${s.dn.includes(s.ei+':'+i)?P.c:i===s.si?P.c+'55':'#333'};${i===s.si?'border-color:'+P.c:''}"></i>`).join('')}</div></div>`:''}
${d?`<div class="c" style="width:100%;margin-bottom:16px"><p style="color:#00E676;font-size:26px">WORKOUT COMPLETE</p><p class="mono mut" style="font-size:13px;margin:6px 0 14px">${s.log.length} sets logged${v?`, volume ${Math.round(v).toLocaleString()} ${unit}`:''}</p><label style="text-align:left">HOW DID IT FEEL? ANY DISCOMFORT?<textarea rows="3" data-s="sn"></textarea></label></div>`:''}
<div class="ctl">${d?'<button class="big" style="background:#00E676" data-a="end">FINISH</button>':`${s.phase==='EXERCISE'?`<button class="big" style="background:${P.c}" data-a="done">✓ SET DONE</button>`:''}<div class="row"><button data-a="pause">${s.paused?'▶ Resume':'⏸ Pause'}</button><button data-a="skip">⏭ Skip</button><button style="color:var(--r)" data-a="end">✕ End</button></div>`}</div></div>`}

const VIEWS={home,edit,pre,hist,active};
const draw=()=>{$('#app').innerHTML=VIEWS[view]();window.scrollTo(0,0)};
const drawKeep=()=>{const y=scrollY;$('#app').innerHTML=VIEWS[view]();scrollTo(0,y)};
const showSheet=()=>{const l=sheet;$('#sheet').innerHTML=l?`<div class="ov"><div class="sheet"><h3>${esc(l.ex)}: SET ${l.set}</h3>
<div class="g2"><label>WEIGHT (${unit})<input type="number" inputmode="decimal" step="any" data-s="log" data-f="w" value="${l.w}"></label><label>REPS DONE<input type="number" inputmode="numeric" data-s="log" data-f="reps" value="${l.reps}"></label></div>
<label>EFFORT: <b class="y" id="rl">${l.rpe}</b>/10 (10 = nothing left)<input type="range" min="1" max="10" data-s="log" data-f="rpe" value="${l.rpe}"></label>
<label>NOTES (PROGRESS, DISCOMFORT)<textarea rows="2" data-s="log" data-f="note">${esc(l.note)}</textarea></label>
<div class="row"><button class="b2 fl" data-a="logskip">Skip</button><button class="b1 fl" data-a="logsave" style="flex:2">Save set</button></div></div></div>`:''};

function step(){const s=S;if(s.paused||s.phase==='DONE')return;
 if(s.phase==='WARMUP'){if(--s.wr<=0){s.wr=0;s.phase=s.w.exercises.length?'EXERCISE':'COOLDOWN'}}
 else if(s.phase==='COOLDOWN'){if(--s.cr<=0){s.cr=0;s.phase='DONE'}}
 else{s.dr--;if(s.phase==='REST'&&--s.rr<=0){s.rr=0;s.phase='EXERCISE'}if(s.dr<=0){s.dr=0;s.phase='COOLDOWN'}}}
function fin(){if(S.phase==='DONE'&&!S.hid)saveSession()}
function saveSession(){const e={id:Date.now(),date:today(),workout:S.w.name,mins:Math.round((S.dt-S.dr)/60),log:S.log,note:''};history.push(e);saveH();S.hid=e.id}
function tick(){if(view!=='active'||!S)return;const n=Math.min(Math.round((Date.now()-S.last)/1000),7200);if(n<1)return;S.last+=n*1000;
 const was=S.phase;if(!S.paused)for(let i=0;i<n;i++)step();fin();if(!S.paused&&was!=='DONE')drawKeep()}
setInterval(tick,500);
const lock=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S)lock()});

function done(){const s=S;if(s.phase!=='EXERCISE')return;const exs=s.w.exercises,c=exs[s.ei];if(!c)return;
 const p=history.flatMap(h=>h.log).concat(s.log).filter(x=>x.ex===c.name).pop();
 sheet={ex:c.name,set:s.si+1,w:p?p.w:'',reps:p&&p.reps?p.reps:c.minReps,rpe:p?p.rpe:7,note:''};
 s.dn.push(s.ei+':'+s.si);
 if(s.si+1<c.sets){s.si++;s.rr=s.rt=c.restTime;s.phase='REST'}
 else if(s.ei+1<exs.length){s.ei++;s.si=0;s.rr=s.rt=c.restTime;s.phase='REST'}
 else s.phase='COOLDOWN';
 drawKeep();showSheet()}

let cf=null;
function ask(m,fn,lbl){cf=fn;$('#confirm').innerHTML=`<div class="ov"><div class="sheet"><h3>${m}</h3><div class="row"><button class="b2 fl" data-a="cno">Cancel</button><button class="bd fl" data-a="cyes">${lbl||'Confirm'}</button></div></div></div>`}
const A={
 go:d=>{view=d.v;draw()},
 cno:()=>{cf=null;$('#confirm').innerHTML=''},
 cyes:()=>{const f=cf;cf=null;$('#confirm').innerHTML='';if(f)f()},
 delw:d=>ask('Delete this workout? Your logged history stays.',()=>{workouts=workouts.filter(w=>w.id!==d.id);sv('forge.workouts',workouts);toast('Workout deleted');view='home';draw()},'Delete'),
 unit:()=>{unit=unit==='lb'?'kg':'lb';sv('forge.unit',unit);draw()},
 start:d=>{sel=workouts.find(w=>w.id===d.id);view='pre';draw()},
 edit:d=>{ed=JSON.parse(JSON.stringify(workouts.find(w=>w.id===d.id)));view='edit';draw()},
 new:()=>{ed={id:uid(),name:'New Workout',exercises:[]};view='edit';draw()},
 addEx:()=>{ed.exercises.push({id:uid(),name:'New Exercise',sets:3,minReps:8,maxReps:12,restTime:60});drawKeep()},
 rmEx:d=>{ed.exercises=ed.exercises.filter(e=>e.id!==d.id);drawKeep()},
 save:()=>{ed.name=ed.name.trim()||'Workout';ed.exercises.forEach(e=>{e.sets=Math.max(1,e.sets)});const i=workouts.findIndex(w=>w.id===ed.id);i<0?workouts.push(ed):workouts[i]=ed;sv('forge.workouts',workouts);toast('Workout saved!');view='home';draw()},
 del:()=>A.delw({id:ed.id}),
 t:d=>{times[d.k]=Math.max(0,times[d.k]+ +d.d);drawKeep()},
 begin:()=>{const t=times;S={w:sel,wt:t.warmup*60,dt:t.duration*60,ct:t.cooldown*60,wr:t.warmup*60,dr:t.duration*60,cr:t.cooldown*60,phase:'WARMUP',ei:0,si:0,rr:0,rt:0,paused:false,log:[],dn:[],last:Date.now(),hid:null};view='active';lock();draw()},
 done,
 skip:()=>{const s=S;if(s.phase==='WARMUP')s.phase=s.w.exercises.length?'EXERCISE':'COOLDOWN';else if(s.phase==='REST'){s.rr=0;s.phase='EXERCISE'}else if(s.phase==='EXERCISE')s.phase='COOLDOWN';else if(s.phase==='COOLDOWN')s.phase='DONE';fin();drawKeep()},
 pause:()=>{S.paused=!S.paused;drawKeep()},
 end:()=>{const go=()=>{if(S.log.length&&!S.hid)saveSession();else if(S.hid)saveH();if(wl)try{wl.release()}catch(e){}S=null;view='hist';if(history.length)oh=String(history[history.length-1].id);draw()};S.phase==='DONE'?go():ask('End this workout? Sets you logged will be saved.',go,'End workout')},
 logsave:()=>{const l=sheet,w=parseFloat(l.w);S.log.push({ex:l.ex,set:l.set,w:isNaN(w)?'':w,reps:parseInt(l.reps)||'',rpe:+l.rpe,note:l.note.trim(),u:unit});if(S.hid)saveH();sheet=null;showSheet();toast('Set logged')},
 logskip:()=>{sheet=null;showSheet()},
 hx:d=>{oh=oh===d.id?null:d.id;drawKeep()},
 hdel:d=>ask('Delete this session?',()=>{history=history.filter(h=>String(h.id)!==d.id);saveH();oh=null;drawKeep()},'Delete')
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener('input',e=>{const t=e.target,s=t.dataset.s;if(!s)return;const v=t.value,f=t.dataset.f,id=t.dataset.id;
 if(s==='wn')ed.name=v;
 else if(s==='ex'){const x=ed.exercises.find(x=>x.id===id);x[f]=f==='name'?v:Math.max(0,parseInt(v)||0)}
 else if(s==='log'){sheet[f]=v;if(f==='rpe')$('#rl').textContent=v}
 else{const h=history.find(h=>String(h.id)===(s==='sn'?String(S.hid):id));if(!h)return;if(s==='hd'){if(v)h.date=v}else h.note=v;saveH()}});
draw();
</script></body></html>
